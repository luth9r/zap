"$schema" = "https://raw.githubusercontent.com/luth9r/zap/blob/main/zap.schema.json"

# ==============================================================================
# ZAP CONFIGURATION CHEATSHEET & EXAMPLES
# ==============================================================================
#
# Ready-to-use complete themes are available in `examples/themes/`:
#   - powerline-warm.toml     (Sunset Powerline gradient)
#   - catppuccin-mocha.toml    (Catppuccin pastel palette)
#   - rainbow-pills.toml       (Rounded capsule bubbles)
#   - two-line-frame.toml      (Two-line prompt with frame)
#   - minimal-pure.toml        (Clean minimalist prompt)
#
# 1. TEXT MODIFIERS:
#    - bold, dimmed (or dim), italic, underline (or underlined),
#    - blink, inverted (or invert), hidden, strikethrough, reset, none
#
# 2. NAMED COLORS:
#    - Standard: black, red, green, yellow, blue, magenta, purple, cyan, white
#    - Bright:   bright-black (gray, grey), bright-red, bright-green,
#                bright-yellow, bright-blue, bright-magenta, bright-purple,
#                bright-cyan, bright-white
#
# 3. ADVANCED COLORS & PREFIXES:
#    - Foreground:  fg:<color> (e.g. fg:cyan, fg:27, fg:#50fa7b)
#    - Background:  bg:<color> (e.g. bg:blue, bg:200, bg:#282a36)
#    - Hex TrueColor: #RGB or #RRGGBB (e.g. #fff, #bf5700, #bd93f9)
#    - ANSI 256:      0 - 255 (e.g. 240, fg:27, bg:235)
#
# 4. COMBINED STYLE STRINGS:
#    - "bold cyan"
#    - "bold italic fg:#50fa7b bg:#282a36"
#    - "underline bg:#bf5700 fg:white"
#    - "dimmed 240"
#
# 5. TEMPLATES & ESCAPING:
#    - Variable / Module:    $directory, $character, $path, $symbol
#    - Escape Character (\): Use backslash '\' to escape any special symbol:
#        * \$  -> literal '$' (write as "\\$" in TOML strings)
#        * \[  -> literal '[' (not a styled block)
#        * \]  -> literal ']'
#        * \(  -> literal '(' (not a conditional group)
#        * \)  -> literal ')'
#        * \\  -> literal '\'
#    - Styled Blocks:        [content](style) (e.g. "[$path](bold cyan)")
#    - Conditional Blocks:   (prefix $var suffix) - renders only if $var is non-empty
# ==============================================================================

# Inserts a blank line between shell prompts
add_newline = true

# Root prompt format string.
# Supports modules ($os, $directory, $git_branch, $git_commit, $git_state, $git_status, $cmd_duration, $character),
# multiline strings ("""..."""), styled blocks [content](style), and escaping (\$ for literal '$').
format = "$os$directory$git_branch$git_commit$git_state$git_status$cmd_duration$character"

[directory]
format = "[$path]($style)[$read_only]($read_only_style) "
style = "bold cyan"
home_symbol = "~"
read_only = " 󰌾"
read_only_style = "bold red"
truncation_length = 3
truncation_symbol = "…/"
truncate_to_repo = true
disabled = false

[git_branch]
format = "on [$symbol$branch]($style) "
symbol = " "
style = "bold purple"
truncation_length = 0
truncation_symbol = "…"
disabled = false

[git_commit]
format = "[\\($hash$tag\\)]($style) "
style = "bold green"
commit_hash_length = 7
only_detached = true
tag_symbol = "  "
tag_disabled = true
disabled = false

[git_state]
format = "\\([$state( $progress_current/$progress_total)]($style)\\) "
style = "bold yellow"
rebase = "REBASING"
merge = "MERGING"
revert = "REVERTING"
cherry_pick = "CHERRY-PICKING"
bisect = "BISECTING"
am = "AM"
am_or_rebase = "AM/REBASE"
disabled = false

[git_status]
format = "[[$all_status$ahead_behind]]($style) "
style = "bold red"
staged = "+"
modified = "!"
untracked = "?"
deleted = "✘"
stashed = "$"
ahead = "⇡"
behind = "⇣"
diverged = "⇕"
conflicted = "="
up_to_date = ""
disabled = false

[cmd_duration]
min_time = 2000
format = "took [$duration]($style) "
style = "bold yellow"
show_milliseconds = false
disabled = false

[character]
format = "$symbol "
success_symbol = "[❯](bold green)"
error_symbol = "[❯](bold red)"
disabled = false

[os]
format = "[$symbol]($style) "
style = "bold white"
disabled = false

[zig_lang]
format = "[$symbol$version]($style) "
symbol = "↯ "
style = "bold yellow"
version = ""
disabled = false
