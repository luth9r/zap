"$schema" = "https://raw.githubusercontent.com/luth9r/zap/main/zap.schema.json"

# Powerline Warm (Inspired by Oh My Posh sunset palette)
add_newline = false
format = "$directory$git_branch$git_status[](fg:#F59E0B bg:#3B82F6)$cmd_duration[](fg:#3B82F6 bg:#10B981)$character"

[directory]
format = "[](fg:#EA580C)[  $path ](bold fg:#FFFFFF bg:#EA580C)[](fg:#EA580C bg:#F59E0B)"
style = "none"
truncation_length = 3
truncate_to_repo = false

[git_branch]
format = "[  $branch ](bold fg:#1E293B bg:#F59E0B)"
style = "none"

[git_status]
format = "[[$all_status$ahead_behind ]](bold fg:#7C2D12 bg:#F59E0B)"
style = "none"
staged = "+ "
modified = "! "
untracked = "? "
ahead = "⇡"
behind = "⇣"
diverged = "⇕"

[cmd_duration]
min_time = 0
format = "[ ⚡$duration ](bold fg:#FFFFFF bg:#3B82F6)"
style = "none"

[character]
format = "[ ❯ ](bold fg:#FFFFFF bg:#10B981)[](fg:#10B981) "
success_symbol = "[ ❯ ](bold fg:#FFFFFF bg:#10B981)[](fg:#10B981) "
error_symbol = "[ ✘ ](bold fg:#FFFFFF bg:#EF4444)[](fg:#EF4444) "
