"$schema" = "https://raw.githubusercontent.com/luth9r/zap/main/zap.schema.json"

# Two-Line Framed Prompt
add_newline = true
format = "[┌─](bold fg:#64748B) $directory$git_branch$git_status$cmd_duration\n[└─](bold fg:#64748B)$character"

[directory]
format = "[󰝰 $path](bold cyan) "
style = "bold cyan"
truncation_length = 3
truncate_to_repo = false

[git_branch]
format = "on [ $branch](bold purple) "
style = "bold purple"

[git_status]
format = "[[($all_status$ahead_behind)]](bold red) "
style = "bold red"
staged = "+"
modified = "!"
untracked = "?"
ahead = "⇡"
behind = "⇣"
diverged = "⇕"

[cmd_duration]
min_time = 0
format = "took [⚡$duration](bold yellow) "
style = "bold yellow"

[character]
format = "[❯](bold green) "
success_symbol = "[❯](bold green) "
error_symbol = "[❯](bold red) "
